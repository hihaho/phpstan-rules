name: Code style

# Check only: Rector and Pint run as dry runs and the job fails when either
# would change a file. Nothing is committed back; fix locally with
# `composer rector` and `composer fix-cs`.

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'rector.php'
      - 'pint.json'
      - 'composer.json'
      - '.github/workflows/code-style.yml'
  pull_request:
    paths:
      - '**.php'
      - 'rector.php'
      - 'pint.json'
      - 'composer.json'
      - '.github/workflows/code-style.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    name: code-style
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0

      - name: Rector (dry run)
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Pint (test)
        run: vendor/bin/pint --test
