name: Auto-fix

# Triggered on branch pushes, not pull_request. Only collaborators with write
# access can push a branch to this repo, so the code Rector/Pint execute is
# never untrusted fork code — forks push to their own fork, which cannot fire
# this workflow. This also sidesteps CodeQL's untrusted-checkout rule entirely:
# `push` is not an untrusted trigger, and the default checkout below carries no
# head-ref `ref:` argument, so it is not a "PR HEAD checkout" the rule flags.
# The default branch is excluded so auto-fixes never commit straight to main.
on:
  push:
    branches-ignore:
      - main
    paths:
      - '**.php'
      - 'rector.php'
      - 'pint.json'
      - '.github/workflows/auto-fix.yml'

permissions:
  contents: write

concurrency:
  group: auto-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No head-ref `ref:` argument: the default checkout of the pushed
          # branch keeps this off CodeQL's untrusted-checkout radar. Credentials
          # are still withheld from the working tree so the branch's Rector/Pint
          # config can't piggy-back on the token; the auto-commit step re-attaches
          # push credentials only after that code has run.
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0

      - name: Cache Rector results
        uses: actions/cache@v6
        with:
          path: .cache/rector/
          key: rector-cache-${{ hashFiles('rector.php') }}
          restore-keys: rector-cache-

      - name: Cache Pint results
        uses: actions/cache@v6
        with:
          path: .cache/pint/
          key: pint-cache-${{ hashFiles('pint.json') }}
          restore-keys: pint-cache-

      - name: Run Rector
        run: vendor/bin/rector process --no-diffs

      - name: Run Pint
        uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # 2.6
        with:
          configPath: pint.json
          verboseMode: true

      # Verify the auto-fixed tree still type-checks BEFORE committing. A bad
      # Rector/Pint result that breaks PHPStan must be discarded, not committed
      # blind: the auto-commit step pushes via GITHUB_TOKEN, which suppresses CI
      # re-triggering on the bot push, so an unverified fix would otherwise land
      # on the branch unchecked. On failure, hard-reset the working tree
      # (nothing is committed) and fail the job so the author sees the break.
      - name: Verify PHPStan still passes
        run: |
          if ! vendor/bin/phpstan analyse --memory-limit=2G --no-progress; then
            echo "::error::PHPStan failed after auto-fix — discarding changes, nothing committed."
            git reset --hard HEAD
            exit 1
          fi

      # Re-attach push credentials only now — after the branch-controlled
      # rector.php / pint.json have already executed — so that config never
      # runs with a write token in git config (the reason checkout used
      # persist-credentials: false), while the auto-commit step below can still
      # push. git-auto-commit-action does not authenticate itself; it relies on
      # the remote's credentials, which the hardened checkout deliberately omits.
      - name: Restore push credentials
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 'chore: auto-fix'
          # Only commit what Rector/Pint actually format. The default pattern
          # ('.') also captures composer-install side effects — notably the
          # environment-specific .config/boost/manifest.json regenerated by the
          # post-install boost sync — which produced spurious "auto-fix" commits
          # on every push and then failed to push.
          file_pattern: '*.php **/*.php'
