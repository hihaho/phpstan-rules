name: "Update Changelog"

on:
  release:
    types: [released]

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_TARGET: ${{ github.event.release.target_commitish }}
      RELEASE_BODY: ${{ github.event.release.body }}
      RELEASE_URL: ${{ github.event.release.html_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TARGET }}
          # create-pull-request supplies its own auth via `token:`. Leaving
          # the checkout token persisted results in `Duplicate header:
          # Authorization` when create-pull-request prunes the remote.
          persist-credentials: false

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@1171d74932456fd2049c486b8757956a6adcc11b # v1.13.0
        with:
          latest-version: ${{ env.RELEASE_TAG }}
          release-notes: ${{ env.RELEASE_BODY }}

      - name: Open CHANGELOG PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/changelog-${{ env.RELEASE_TAG }}
          base: ${{ env.RELEASE_TARGET }}
          commit-message: "Update CHANGELOG for ${{ env.RELEASE_TAG }}"
          title: "Update CHANGELOG for ${{ env.RELEASE_TAG }}"
          body: |
            Auto-generated by the `Update Changelog` workflow after publishing
            [${{ env.RELEASE_TAG }}](${{ env.RELEASE_URL }}).

            This workflow prepends the release body to `CHANGELOG.md` and
            opens this pull request instead of committing directly to `main`.
            Safe to merge once CI is green.
          add-paths: CHANGELOG.md
          delete-branch: true
